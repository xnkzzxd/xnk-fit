name: Screenshots

# Screenshots of every main screen from an emulator, for judging the look without a phone (docs/TODO.md B-17/B-18 follow-up).
# Separate from ci.yml on purpose: it is slow and must never block the checks there.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.sha }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug app and screenshot test APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      # One emulator (API 34); phone and tablet are two window sizes of it (wm size/density), see tools/screenshots/run-variants.sh.
      - name: Run screenshot tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/screenshots/run-variants.sh screenshots

      - name: Build index
        if: always()
        run: python3 tools/screenshots/make_index.py screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
