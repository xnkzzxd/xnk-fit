name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Text-literal rule (Design §13): the checker, its own tests, then the real sources.
      - name: Text-literal rule tests
        run: python3 -m unittest discover -s tools
      - name: Text-literal rule
        run: python3 tools/check_text_literals.py
      - name: APK size gate tests
        run: tools/test_check_apk_size.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      # The build rewrites app/schemas/ from the entities. A changed or new file means the schema moved
      # without a version bump and a committed JSON; commit it on purpose (Design §3) or fix the entities.
      - name: Schema JSON is committed and unchanged
        run: git diff --exit-code -- app/schemas && test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: Lint
        run: ./gradlew --no-daemon lintRelease
      - name: Build release (R8 on)
        run: ./gradlew --no-daemon assembleRelease

      - name: Permission check (Design §14)
        run: tools/check_permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      # Budget 20 MB (Design §10). Fails the job when exceeded.
      - name: APK size check
        run: tools/check_apk_size.sh app/build/outputs/apk/release/app-release-unsigned.apk 20971520

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore
