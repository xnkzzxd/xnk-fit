<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar belanja · XNK Fit mockup</title>
<link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
</head>
<body class="full">
<div class="topbar"><button class="icon-btn" data-back="planner.html" aria-label="Kembali"><i data-i="back"></i></button><b class="grow">Daftar belanja</b><button class="icon-btn" aria-label="Bagikan" data-toast="(Bagikan sebagai teks)"><i data-i="share"></i></button></div>
<main class="page stack" style="max-width:900px;margin:12px auto 0">
  <div class="seg" data-radio><button class="on">Sisa minggu ini</button><button>3 hari ke depan</button></div>
  <p class="small muted">Dari rencana minggu</p>
  <div class="cols">
    <div class="stack">
      <div class="label">Lauk</div>
      <div class="list">
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Ayam (paha) <span class="muted">· 3 potong, ±450 g</span></span></div>
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Telur ayam <span class="muted">· 6 butir</span></span></div>
        <div class="li done" data-row><button class="check on" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Tempe <span class="muted">· 1 papan</span></span></div>
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Ikan kembung <span class="muted">· 2 ekor</span></span></div>
      </div>
    </div>
    <div class="stack">
      <div class="label">Sayur dan buah</div>
      <div class="list">
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Kangkung <span class="muted">· 1 ikat</span></span></div>
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Timun, kemangi (lalapan)</span></div>
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Pisang <span class="muted">· 4 buah</span></span></div>
      </div>
      <div class="label">Pokok</div>
      <div class="list">
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Beras <span class="muted">· ±1 kg</span></span></div>
        <div class="li" data-row><button class="check" aria-label="Sudah dibeli"><i data-i="check"></i></button><span class="grow">Oat <span class="muted">· ±200 g</span></span></div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
