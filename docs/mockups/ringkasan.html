<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ringkasan latihan · XNK Fit mockup</title>
<link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
</head>
<body class="full">
<header class="head">
  <div class="head-top"><a class="icon-btn" href="hari-ini.html" aria-label="Tutup"><i data-i="close"></i></a><span class="grow">Selesai</span><a class="icon-btn" href="kartu.html?state=k:edit" aria-label="Bagikan"><i data-i="share"></i></a></div>
</header>
<main class="page stack" style="max-width:980px">
  <section class="card ink geo">
    <span class="label">Kamis, 19 Nov · +10 poin</span>
    <h2 style="font-size:1.6rem;margin-top:8px">Full Body B</h2>
    <div class="kv" style="margin-top:16px"><div><b>52</b><span>Menit</span></div><div><b>4.280</b><span>Volume kg</span></div><div><b>14</b><span>Set</span></div></div>
  </section>
  <div class="cols">
    <div class="stack">
      <div class="card"><div class="card-title"><h3>Rekor baru</h3><span class="small muted"><b>2</b></span></div>
        <div class="li" style="padding-inline:0"><span class="ex-th" data-fig="goblet-squat" data-still></span><span class="grow"><b>Goblet Squat</b><br><span class="xs muted">16 kg × 12</span></span><span class="pill acc">Rekor</span></div>
        <div class="li" style="padding-inline:0"><span class="ex-th" data-fig="db-rdl" data-still></span><span class="grow"><b>Romanian Deadlift</b><br><span class="xs muted">24 kg × 10</span></span><span class="pill acc">Rekor</span></div></div>
      <div class="card"><div class="row-flex" style="gap:14px"><div class="bdg"><div class="b" style="margin:0"><i data-i="medal"></i></div></div><div><span class="label">Lencana baru</span><h3 style="margin-top:2px">Lima kali latihan</h3></div></div></div>
      <div class="card stack"><div class="card-title" style="margin-bottom:0"><h3>Rasanya?</h3></div>
        <div class="seg" data-radio aria-label="Rasa 1 sampai 5"><button>1</button><button>2</button><button>3</button><button class="on">4</button><button>5</button></div>
        <div class="spread xs muted"><span>Berat</span><span>Ringan</span></div>
        <textarea class="input" placeholder="Catatan" aria-label="Catatan"></textarea></div>
    </div>
    <div class="card"><div class="card-title"><h3>Otot dilatih</h3></div><div data-mm="QUADS:1,GLUTES:1,CHEST:1,LATS:1,HAMS:2,TRICEPS:2,BICEPS:2,ABS:2,LOWER_BACK:2"></div>
      <div class="legend" style="margin-top:8px"><span><i class="l1"></i>Utama</span><span><i class="l2"></i>Pembantu</span></div></div>
  </div>
  <div class="btn-row"><a class="btn lg" href="kartu.html?state=k:edit"><i data-i="share"></i>Bagikan</a><a class="btn pri lg" href="hari-ini.html">Simpan</a></div>
</main>
</body>
</html>
