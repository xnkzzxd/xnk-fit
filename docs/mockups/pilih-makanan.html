<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilih makanan · XNK Fit mockup</title>
<link rel="stylesheet" href="mock.css"><script src="mock.js"></script>
</head>
<body class="full">
<div class="topbar"><button class="icon-btn" data-back="makan.html" aria-label="Kembali"><i data-i="back"></i></button><b class="grow">Catat makan · Malam</b><button class="icon-btn" data-open="sheet-quick" aria-label="Kalori cepat"><i data-i="flame"></i></button></div>
<div class="mock-states"><b>Keadaan:</b><button data-sw="f:recent" class="on">Terakhir</button><button data-sw="f:search">Hasil cari</button><button data-open="sheet-portion">Porsi</button><button data-sw="f:own">Buat makanan sendiri</button></div>
<main class="page stack" style="max-width:900px;margin:12px auto 0">
  <div data-st="f:recent f:search" class="stack">
    <div class="search"><i data-i="search"></i><input placeholder="Cari: nasi, tempe, mie…" aria-label="Cari makanan" value=""></div>
    <div class="chips scroll" data-radio><button class="chip on" data-sw="f:recent">Terakhir</button><button class="chip">Favorit</button><button class="chip">Semua (TKPI)</button><button class="chip">Kemasan</button><button class="chip">Warung</button><button class="chip" data-sw="f:own">Milik saya</button></div>
  </div>

  <section data-st="f:recent" class="stack">
    <div class="btn-row"><button class="btn sm" data-toast="Siang kemarin disalin"><i data-i="copy"></i>Salin makan kemarin</button><button class="btn sm" data-open="sheet-quick"><i data-i="flame"></i>Kalori cepat</button></div>
    <div class="list">
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Nasi putih</b><br><span class="small muted">1 centong (±100 g) · 180 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Tempe goreng</b><br><span class="small muted">1 potong (±25 g) · 88 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Sayur asem</b> <span class="est">perkiraan</span><br><span class="small muted">1 mangkuk (±200 g) · 80 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Telur ayam rebus</b> <i data-i="star"></i><br><span class="small muted">1 butir (±55 g) · 85 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Mie instan kuah</b><br><span class="small muted">1 bungkus (±75 g) · 350 kkal · label kemasan</span></span><i data-i="plus"></i></button>
    </div>
  </section>

  <section data-st="f:search" hidden class="stack">
    <p class="small muted">"tempe" · 9 hasil</p>
    <div class="list">
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Tempe kedelai murni, mentah</b><br><span class="small muted">TKPI · 1 potong (±25 g) · 50 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Tempe goreng</b><br><span class="small muted">TKPI · 1 potong (±25 g) · 88 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Tempe bacem</b> <span class="est">perkiraan</span><br><span class="small muted">Warung · 1 potong (±30 g) · 75 kkal</span></span><i data-i="plus"></i></button>
      <button class="li" data-open="sheet-portion"><span class="grow"><b>Orek tempe</b> <span class="est">perkiraan</span><br><span class="small muted">Resep · 2 sdm (±40 g) · 90 kkal</span></span><i data-i="plus"></i></button>
    </div>
    <button class="btn block" data-sw="f:own">Tidak ketemu? Buat makanan sendiri</button>
  </section>

  <section data-st="f:own" hidden class="stack">
    <div class="card stack"><h2>Makanan sendiri</h2>
      <label class="field"><span>Nama</span><input class="input" value="Nasi bakar ibu"></label>
      <div class="seg" data-radio><button class="on">Per porsi</button><button>Per 100 g</button><button>Resep dari bahan</button></div>
      <div class="cols"><label class="field"><span>Kalori (kkal)</span><input class="input" inputmode="numeric" value="420"></label><label class="field"><span>Berat porsi (g, opsional)</span><input class="input" inputmode="numeric" value="250"></label></div>
      <div class="cols-3"><label class="field"><span>Protein (g)</span><input class="input" inputmode="decimal" value="14"></label><label class="field"><span>Karbo (g)</span><input class="input" inputmode="decimal" value="60"></label><label class="field"><span>Lemak (g)</span><input class="input" inputmode="decimal" value="13"></label></div>
      <button class="btn pri block lg" data-sw="f:recent" data-toast="Tersimpan di Milik saya">Simpan</button></div>
  </section>
</main>

<div class="sheet" id="sheet-portion" role="dialog" aria-label="Porsi"><div class="grab"></div>
  <div class="sheet-head"><h2>Tempe goreng</h2><button class="icon-btn" aria-label="Favorit" data-toast="Ditambah ke favorit"><i data-i="star"></i></button><button class="icon-btn" data-close aria-label="Tutup"><i data-i="close"></i></button></div>
  <div class="stack">
    <div><div class="field"><span>Ukuran rumah tangga</span></div><div class="chips" data-radio><button class="chip on">1 potong</button><button class="chip">1 sdm</button><button class="chip">Gram</button></div></div>
    <div class="spread"><div class="stepper" style="width:200px"><button data-step="-0.5">−</button><input inputmode="decimal" value="2" aria-label="Jumlah"><button data-step="0.5">+</button></div><span class="muted">±50 g</span></div>
    <div class="kv"><div><b>176</b><span>kkal</span></div><div><b>10 g</b><span>Protein</span></div><div><b>6 g</b><span>Karbo</span></div><div><b>11 g</b><span>Lemak</span></div></div>
    <p class="xs muted">Sumber: TKPI 2020. Berat "1 potong" adalah perkiraan rumah tangga (±).</p>
    <div class="seg" data-radio><button>Pagi</button><button>Siang</button><button class="on">Malam</button><button>Camilan</button></div>
    <button class="btn pri block lg" data-close data-toast="Tempe goreng dicatat">Catat</button>
  </div>
</div>

<div class="sheet" id="sheet-quick" role="dialog" aria-label="Kalori cepat"><div class="grab"></div>
  <div class="sheet-head"><h2>Kalori cepat</h2><button class="icon-btn" data-close aria-label="Tutup"><i data-i="close"></i></button></div>
  <div class="stack"><label class="field"><span>Kalori (kkal)</span><input class="input" inputmode="numeric" value="150"></label>
    <button class="btn pri block lg" data-close data-toast="Tersimpan">Simpan</button></div>
</div>
</body>
</html>
